[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "takeloom"
version = "0.4.14"
description = "Music Recording Session Manager"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "wakepy>=0.7.0",
    "Pillow>=9.0.0",
    "tkinterdnd2>=0.3.0",
    "opencv-python>=4.8.0",
    "streamdeck>=0.9.0",
    "pyusb>=1.2.1",
    "static-ffmpeg>=2.5",
    "python-rtmidi>=1.5.0",
]

[project.scripts]
takeloom = "takeloom.__main__:main"
