[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "takeloom"
# From git tags (hatch-vcs): a release is the tag vX.Y.Z (made by
# .github/workflows/release.yml); anything after it builds as
# X.Y.(Z+1).devN — see docs/releasing.md.
dynamic = ["version"]
description = "Music Recording Session Manager"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "wakepy>=0.7.0",
    "Pillow>=9.0.0",
    "tkinterdnd2>=0.3.0",
    "opencv-python>=4.8.0",
    "streamdeck>=0.9.0",
    "pyusb>=1.2.1",
    "static-ffmpeg>=2.5",
    # macOS only: MIDI keyboards are only ever attached to the Mac Mini, and
    # on Linux there's no prebuilt wheel for current Pythons — building it
    # needs pkg-config + ALSA headers, and its failure silently blocked
    # every laptop auto-update for weeks. audio/midi_input.py already
    # treats a missing rtmidi as "no MIDI devices".
    "python-rtmidi>=1.5.0; sys_platform == 'darwin'",
    "pyfluidsynth>=1.3.2",
    "mido>=1.3.0",
]

[project.scripts]
takeloom = "takeloom.__main__:main"

[tool.hatch.build.targets.wheel.force-include]
# The camera app's version, so takeloom can tell when a phone's is behind
# (see takeloom/phone_camera/app_version.py).
"camera_app/VERSION" = "takeloom/data/camera_app_VERSION"

[tool.hatch.version]
source = "vcs"
# Only release tags count — not the daily-YYYY-MM-DD build tags.
raw-options = { git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"], local_scheme = "no-local-version", fallback_version = "0.0.0" }
