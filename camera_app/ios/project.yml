name: TakeloomCamera
options:
  bundleIdPrefix: com.priestc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # camera_app/VERSION, written here by `takeloom make-release --camera`
    # (CURRENT_PROJECT_VERSION: 1.2.3 -> 10203). Don't edit by hand.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "10001"
targets:
  TakeloomCamera:
    type: application
    platform: iOS
    sources: [TakeloomCamera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priestc.takeloomcamera
        INFOPLIST_FILE: TakeloomCamera/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
