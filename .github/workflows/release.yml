# Release: run by hand (Actions tab -> Release -> Run workflow, or
# `gh workflow run release.yml -f bump=minor`). Tags the current main as
# the next version, builds it, and publishes it as a GitHub release. The
# package-manager channels (PyPI, Homebrew, apt, ...) hang off the end of
# this as they're added. See docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "::error::main is already released as $previous — nothing new to release."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${previous#v}"
          case "${{ inputs.bump }}" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Releasing $version (previous: $previous)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "takeloom ${{ steps.version.outputs.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
          ls dist
          # The tag must have produced exactly this version, not a .dev one.
          test -f "dist/takeloom-${{ steps.version.outputs.version }}-py3-none-any.whl"

      - name: Smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 libsndfile1
          python -m pip install --quiet dist/*.whl
          takeloom --help

      - name: Push tag and publish release
        run: |
          version="${{ steps.version.outputs.version }}"
          previous="${{ steps.version.outputs.previous }}"
          git push origin "v$version"
          {
            echo "### Changes since $previous"
            git log --format='- %s (%h)' "$previous..HEAD"
          } > notes.md
          gh release create "v$version" dist/* --latest --title "takeloom $version" --notes-file notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    # Trusted publishing: PyPI's takeloom project trusts this repo's
    # release.yml in the "pypi" environment, so no token is stored anywhere.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/takeloom/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    # Points priestc/homebrew-takeloom's formula at this release's sdist on
    # PyPI — so after the pypi job, once that URL exists. Needs the
    # HOMEBREW_TAP_TOKEN secret: a fine-grained token with contents
    # read/write on that one repo.
    needs: [release, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Update the tap's formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so priestc/homebrew-takeloom wasn't updated to $VERSION."
            exit 0
          fi
          url="https://files.pythonhosted.org/packages/source/t/takeloom/takeloom-$VERSION.tar.gz"
          sha=$(sha256sum "dist/takeloom-$VERSION.tar.gz" | cut -d' ' -f1)
          git clone --quiet "https://x-access-token:$TAP_TOKEN@github.com/priestc/homebrew-takeloom.git" tap
          cd tap
          sed -i -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/takeloom.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "takeloom $VERSION"
          git push --quiet
