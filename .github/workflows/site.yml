# Publish the package repositories on GitHub Pages
# (https://priestc.github.io/takeloom/) from a release's .debs and Flatpak
# bundles — see packaging/site/build_site.sh. Called by release.yml;
# runnable by hand for an existing release:
#   gh workflow run site.yml -f release_tag=vX.Y.Z
# Signs with the APT_SIGNING_KEY secret (apt and Flatpak alike).
name: Package repositories

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release whose packages to publish (e.g. v0.5.3)
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      APT_SIGNING_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release's packages
        run: |
          gh release download "${{ inputs.release_tag }}" -p '*.deb' -D debs -R "$GITHUB_REPOSITORY"
          gh release download "${{ inputs.release_tag }}" -p '*.flatpak' -D flatpaks -R "$GITHUB_REPOSITORY"
          ls -lh debs flatpaks
      - name: Build and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils flatpak ostree > /dev/null
          packaging/site/build_site.sh site debs flatpaks
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  test-apt:
    # The published apt repository, used exactly as the instructions say.
    needs: deploy
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null
          base=https://priestc.github.io/takeloom/apt
          # Pages can take a minute to serve a fresh deploy.
          for attempt in $(seq 20); do
            curl -fsSL -o /dev/null $base/dists/stable/InRelease && break
            sleep 15
          done
          curl -fsSL $base/takeloom.gpg | tee /usr/share/keyrings/takeloom.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/takeloom.gpg] $base stable main" > /etc/apt/sources.list.d/takeloom.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq takeloom > /dev/null
          dpkg -s takeloom | grep '^Version'
          takeloom --help

  test-flatpak:
    # The published Flatpak repository, via the .flatpakref as the
    # instructions say (which also pulls the runtime from Flathub).
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ref=https://priestc.github.io/takeloom/flatpak/io.github.priestc.Takeloom.flatpakref
          for attempt in $(seq 20); do
            curl -fsSL -o /dev/null https://priestc.github.io/takeloom/flatpak/repo/summary && break
            sleep 15
          done
          flatpak install --user -y --noninteractive "$ref"
          flatpak info --user io.github.priestc.Takeloom | grep -E 'Version|Origin'
          flatpak run io.github.priestc.Takeloom --help
